name: Build Tweak & IPA

on:
  push:
    branches: [master]
    paths-ignore:
      - 'dist/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Theos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Build deb (arm64 + arm64e)
        run: |
          cd Reverse/output/tweak
          make package FINALPACKAGE=1

      - name: Build IPA (arm64 + arm64e)
        run: |
          mkdir -p ios_app_oc/packages
          BEFORE="${{ github.event.before }}"
          CHANGED_IPA=false
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -q '^ios_app_oc/' && CHANGED_IPA=true
          else
            git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^ios_app_oc/' && CHANGED_IPA=true
          fi
          if [ "$CHANGED_IPA" = "true" ]; then
            echo "ios_app_oc changed, building IPA..."
            cd ios_app_oc
            make FINALPACKAGE=1
            APP=$(find . -name "YiJianXinJi.app" -type d | grep -v obj/before | head -1)
            mkdir -p /tmp/Payload
            cp -r "$APP" /tmp/Payload/YiJianXinJi.app
            cd /tmp && zip -qr YiJianXinJi.ipa Payload/
            cp /tmp/YiJianXinJi.ipa "$GITHUB_WORKSPACE/ios_app_oc/packages/YiJianXinJi.ipa"
          else
            echo "ios_app_oc unchanged, reusing previous IPA..."
            LAST_IPA=$(ls dist/YiJianXinJi_v*.ipa 2>/dev/null | sort -V | tail -1)
            if [ -n "$LAST_IPA" ]; then
              cp "$LAST_IPA" ios_app_oc/packages/YiJianXinJi.ipa
              echo "Copied $LAST_IPA"
            else
              echo "No previous IPA found, building from scratch..."
              cd ios_app_oc
              make FINALPACKAGE=1
              APP=$(find . -name "YiJianXinJi.app" -type d | grep -v obj/before | head -1)
              mkdir -p /tmp/Payload
              cp -r "$APP" /tmp/Payload/YiJianXinJi.app
              cd /tmp && zip -qr YiJianXinJi.ipa Payload/
              cp /tmp/YiJianXinJi.ipa "$GITHUB_WORKSPACE/ios_app_oc/packages/YiJianXinJi.ipa"
            fi
          fi

      - name: Verify architectures
        run: |
          echo "=== tweak packages ==="
          ls -la Reverse/output/tweak/packages/ || echo "(empty)"
          echo "=== app packages ==="
          ls -la ios_app_oc/packages/ || echo "(empty)"

          DEB=$(ls Reverse/output/tweak/packages/*.deb | tail -1)
          mkdir -p /tmp/debcheck
          cp "$DEB" /tmp/debcheck/tweak.deb
          cd /tmp/debcheck && ar x tweak.deb
          tar xf data.tar* --wildcards '*.dylib' -C /tmp/debcheck 2>/dev/null || true
          DYLIB=$(find /tmp/debcheck -name "*.dylib" | head -1)
          if [ -n "$DYLIB" ]; then
            echo "=== tweak dylib architectures ==="
            lipo -archs "$DYLIB"
          fi

          IPA="ios_app_oc/packages/YiJianXinJi.ipa"
          if [ -f "$IPA" ]; then
            mkdir -p /tmp/ipacheck
            unzip -q "$IPA" -d /tmp/ipacheck
            APPBIN=$(find /tmp/ipacheck -name "YiJianXinJi" -type f | head -1)
            [ -n "$APPBIN" ] && echo "=== IPA architectures ===" && lipo -archs "$APPBIN"
          fi

      - name: Copy to dist/ with version number
        run: |
          MAXV=$(ls dist/ 2>/dev/null | grep -oE '_v[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1)
          V=$((${MAXV:-1} + 1))
          echo "NEXT_V=$V" >> $GITHUB_ENV

          DEB=$(ls Reverse/output/tweak/packages/*.deb | tail -1)
          cp "$DEB" "dist/tweak_v${V}.deb"
          echo "  deb: dist/tweak_v${V}.deb"

          cp "ios_app_oc/packages/YiJianXinJi.ipa" "dist/YiJianXinJi_v${V}.ipa"
          echo "  ipa: dist/YiJianXinJi_v${V}.ipa"

      - name: Commit back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "build: v${{ env.NEXT_V }} arm64+arm64e [skip ci]"
          git push
