name: Build Tweak & IPA

on:
  push:
    branches: [master]
    paths-ignore:
      - 'dist/**'
      - '**.md'
      - '.github/**'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Theos
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Build deb (arm64 + arm64e)
        run: |
          cd Reverse/output/tweak
          make package FINALPACKAGE=1

      - name: Build IPA (arm64 + arm64e)
        run: |
          cd ios_app_oc
          make package FINALPACKAGE=1

      - name: Verify architectures
        run: |
          DEB=$(ls Reverse/output/tweak/packages/*.deb | tail -1)
          IPA=$(ls ios_app_oc/packages/*.ipa | tail -1)

          # 解包 deb 提取 dylib 验证架构
          mkdir -p /tmp/debcheck
          cp "$DEB" /tmp/debcheck/tweak.deb
          cd /tmp/debcheck && ar x tweak.deb
          tar xf data.tar* --wildcards '*.dylib' -C /tmp/debcheck 2>/dev/null || true
          DYLIB=$(find /tmp/debcheck -name "*.dylib" | head -1)
          if [ -n "$DYLIB" ]; then
            echo "=== deb dylib architectures ==="
            lipo -archs "$DYLIB"
          fi

          # 解包 IPA 验证架构
          mkdir -p /tmp/ipacheck
          unzip -q "$IPA" -d /tmp/ipacheck
          APPBIN=$(find /tmp/ipacheck -name "YiJianXinJi" -type f | head -1)
          if [ -n "$APPBIN" ]; then
            echo "=== IPA architectures ==="
            lipo -archs "$APPBIN"
          fi

      - name: Copy to dist/ with version number
        run: |
          MAXV=$(ls dist/ 2>/dev/null | grep -oP '_v\K[0-9]+' | sort -n | tail -1)
          V=$((${MAXV:-0} + 1))
          echo "NEXT_V=$V" >> $GITHUB_ENV

          DEB=$(ls Reverse/output/tweak/packages/*.deb | tail -1)
          IPA=$(ls ios_app_oc/packages/*.ipa | tail -1)

          cp "$DEB" "dist/com.dev.amapnewdevice_1.0.0_iphoneos-arm64_v${V}.deb"
          cp "$IPA" "dist/YiJianXinJi_v${V}.ipa"

          echo "Built: v${V}"
          echo "  deb: dist/com.dev.amapnewdevice_1.0.0_iphoneos-arm64_v${V}.deb"
          echo "  ipa: dist/YiJianXinJi_v${V}.ipa"

      - name: Commit back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "build: v${{ env.NEXT_V }} arm64+arm64e [skip ci]"
          git push
