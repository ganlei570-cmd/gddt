name: Build Tweak & IPA

on:
  push:
    branches: [master]
    paths-ignore:
      - 'dist/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Theos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Build deb (arm64 + arm64e)
        run: |
          cd Reverse/output/tweak
          make package FINALPACKAGE=1

      - name: Build IPA (arm64 + arm64e)
        run: |
          cd ios_app_oc
          make package FINALPACKAGE=1

      - name: Verify architectures
        run: |
          echo "=== tweak packages ==="
          ls -la Reverse/output/tweak/packages/ || echo "(empty)"
          echo "=== app packages ==="
          ls -la ios_app_oc/packages/ || echo "(empty)"

          DEB=$(ls Reverse/output/tweak/packages/*.deb | tail -1)
          mkdir -p /tmp/debcheck
          cp "$DEB" /tmp/debcheck/tweak.deb
          cd /tmp/debcheck && ar x tweak.deb
          tar xf data.tar* --wildcards '*.dylib' -C /tmp/debcheck 2>/dev/null || true
          DYLIB=$(find /tmp/debcheck -name "*.dylib" | head -1)
          if [ -n "$DYLIB" ]; then
            echo "=== tweak dylib architectures ==="
            lipo -archs "$DYLIB"
          fi

          APP_PKG=$(ls ios_app_oc/packages/* 2>/dev/null | tail -1)
          if [ -n "$APP_PKG" ]; then
            EXT="${APP_PKG##*.}"
            if [ "$EXT" = "ipa" ]; then
              mkdir -p /tmp/ipacheck
              unzip -q "$APP_PKG" -d /tmp/ipacheck
              APPBIN=$(find /tmp/ipacheck -name "YiJianXinJi" -type f | head -1)
              if [ -n "$APPBIN" ]; then
                echo "=== IPA architectures ==="
                lipo -archs "$APPBIN"
              fi
            else
              echo "=== app package is .$EXT (not IPA) ==="
            fi
          fi

      - name: Copy to dist/ with version number
        run: |
          MAXV=$(ls dist/ 2>/dev/null | grep -oP '_v[0-9]+' | grep -oP '[0-9]+' | sort -n | tail -1)
          V=$((${MAXV:-1} + 1))
          echo "NEXT_V=$V" >> $GITHUB_ENV

          DEB=$(ls Reverse/output/tweak/packages/*.deb | tail -1)
          cp "$DEB" "dist/com.dev.amapnewdevice_1.0.0_iphoneos-arm64_v${V}.deb"
          echo "  deb: dist/com.dev.amapnewdevice_1.0.0_iphoneos-arm64_v${V}.deb"

          APP_PKG=$(ls ios_app_oc/packages/* 2>/dev/null | tail -1)
          if [ -n "$APP_PKG" ]; then
            EXT="${APP_PKG##*.}"
            cp "$APP_PKG" "dist/YiJianXinJi_v${V}.${EXT}"
            echo "  app: dist/YiJianXinJi_v${V}.${EXT}"
          fi

          echo "Built: v${V}"

      - name: Commit back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "build: v${{ env.NEXT_V }} arm64+arm64e [skip ci]"
          git push
