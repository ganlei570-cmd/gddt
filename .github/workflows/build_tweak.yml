name: Build AmapNewDevice

on:
  push:
    paths:
      - 'Reverse/output/tweak/**'
      - 'ios_app/**'
  workflow_dispatch:

jobs:
  build-tweak:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          ln -sf $XCODE_SDK $THEOS/sdks/iPhoneOS16.5.sdk

      - name: Build .deb
        run: make -C Reverse/output/tweak package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: AmapNewDevice-deb
          path: Reverse/output/tweak/packages/*.deb
          if-no-files-found: error

  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios_app && xcodegen generate

      - name: Build app
        run: |
          cd ios_app
          xcodebuild \
            -project AmapNewMachine.xcodeproj \
            -scheme AmapNewMachine \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Package IPA
        run: |
          cd ios_app
          APP_PATH=$(find build/Build/Products -name "*.app" -not -path "*/Intermediates*" | head -1)
          echo "App path: $APP_PATH"
          APP_NAME=$(basename "$APP_PATH" .app)
          echo "App name: $APP_NAME"
          BINARY="$APP_PATH/$APP_NAME"
          echo "Binary: $BINARY"
          brew install ldid
          echo "=== entitlements.plist content ==="
          cat entitlements.plist
          echo "=== end ==="
          # Remove existing empty signature so ldid can sign cleanly
          codesign --remove-signature "$BINARY" 2>/dev/null || true
          echo "Signing with ldid..."
          ldid -S"$(pwd)/entitlements.plist" "$BINARY"
          echo "Verifying entitlements:"
          ldid -e "$BINARY" || true
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r AmapNewMachine.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AmapNewMachine-ipa
          path: ios_app/AmapNewMachine.ipa
          if-no-files-found: error

  build-installer-deb:
    runs-on: macos-latest
    needs: build-ipa
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: AmapNewMachine-ipa
          path: ./ipa

      - name: Create installer deb
        run: |
          brew install dpkg

          mkdir -p pkg/DEBIAN
          mkdir -p "pkg/var/jb/tmp"

          cat > pkg/DEBIAN/control << 'EOF'
Package: com.dev.amapnewmachine
Version: 1.0.1
Architecture: iphoneos-arm64
Maintainer: Dev
Description: 高德地图一键新机 Installer
Section: Tweaks
Priority: optional
EOF

          cat > pkg/DEBIAN/postinst << 'POSTINST'
#!/bin/bash
LOG=/var/mobile/Library/Logs/amapinstall.log
IPA=/var/jb/tmp/AmapNewMachine.ipa
echo "[postinst] start $(date)" >> $LOG

HELPER=""
for p in /var/jb/usr/bin/trollstorehelper /usr/bin/trollstorehelper /var/jb/basebin/trollstorehelper; do
  if [ -x "$p" ]; then HELPER="$p"; break; fi
done
echo "[postinst] helper=$HELPER ipa_exists=$(test -f $IPA && echo yes || echo no)" >> $LOG

if [ -z "$HELPER" ]; then
  echo "[postinst] ERROR: trollstorehelper not found" >> $LOG
  exit 1
fi

"$HELPER" install "$IPA" >> $LOG 2>&1
EXIT=$?
echo "[postinst] install exit=$EXIT" >> $LOG
rm -f "$IPA"
exit $EXIT
POSTINST
          chmod 755 pkg/DEBIAN/postinst

          cat > pkg/DEBIAN/postrm << 'POSTRM'
#!/bin/bash
for p in /var/jb/usr/bin/trollstorehelper /usr/bin/trollstorehelper; do
  [ -x "$p" ] && "$p" uninstall com.amap.newmachine 2>/dev/null && break
done
POSTRM
          chmod 755 pkg/DEBIAN/postrm

          cp ./ipa/AmapNewMachine.ipa "pkg/var/jb/tmp/"
          dpkg-deb --root-owner-group -b pkg com.dev.amapnewmachine_1.0.0_iphoneos-arm64.deb

      - name: Upload installer deb
        uses: actions/upload-artifact@v4
        with:
          name: AmapNewMachine-installer
          path: com.dev.amapnewmachine_1.0.0_iphoneos-arm64.deb
          if-no-files-found: error
