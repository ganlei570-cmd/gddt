name: Build AmapNewDevice

on:
  push:
    paths:
      - 'Reverse/output/tweak/**'
      - 'ios_app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tweak:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          ln -sf $XCODE_SDK $THEOS/sdks/iPhoneOS16.5.sdk

      - name: Build .deb
        run: make -C Reverse/output/tweak package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: AmapNewDevice-deb
          path: Reverse/output/tweak/packages/*.deb
          if-no-files-found: error

  build-ipa:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios_app && xcodegen generate

      - name: Build app
        run: |
          cd ios_app
          xcodebuild \
            -project AmapNewMachine.xcodeproj \
            -scheme AmapNewMachine \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Package IPA
        run: |
          cd ios_app
          APP_PATH=$(find build/Build/Products -name "*.app" -not -path "*/Intermediates*" | head -1)
          echo "App path: $APP_PATH"
          APP_NAME=$(basename "$APP_PATH" .app)
          echo "App name: $APP_NAME"
          BINARY="$APP_PATH/$APP_NAME"
          echo "Binary: $BINARY"
          brew install ldid
          echo "=== entitlements.plist content ==="
          cat entitlements.plist
          echo "=== end ==="
          # Remove existing empty signature so ldid can sign cleanly
          codesign --remove-signature "$BINARY" 2>/dev/null || true
          echo "Signing with ldid..."
          ldid -S"$(pwd)/entitlements.plist" "$BINARY"
          echo "Verifying entitlements:"
          ldid -e "$BINARY" || true
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r AmapNewMachine.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AmapNewMachine-ipa
          path: ios_app/AmapNewMachine.ipa
          if-no-files-found: error

      - name: Commit IPA to dist/
        run: |
          mkdir -p dist
          cp ios_app/AmapNewMachine.ipa dist/AmapNewMachine.ipa
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/AmapNewMachine.ipa
          git diff --cached --quiet || git commit -m "ci: update dist/AmapNewMachine.ipa [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-installer-deb:
    runs-on: macos-latest
    needs: build-ipa
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: AmapNewMachine-ipa
          path: ./ipa

      - name: Create installer deb
        run: |
          brew install dpkg
          mkdir -p pkg/DEBIAN pkg/var/jb/tmp
          python3 - << 'PYEOF'
          import os, stat
          os.makedirs("pkg/DEBIAN", exist_ok=True)
          open("pkg/DEBIAN/control","w").write(
              "Package: com.dev.amapnewmachine\n"
              "Version: 1.0.1\n"
              "Architecture: iphoneos-arm64\n"
              "Maintainer: Dev\n"
              "Description: 高德地图一键新机 Installer\n"
              "Section: Tweaks\n"
              "Priority: optional\n"
          )
          postinst = (
              "#!/bin/bash\n"
              "LOG=/var/mobile/Library/Logs/amapinstall.log\n"
              "IPA=/var/jb/tmp/AmapNewMachine.ipa\n"
              "echo \"[postinst] start $(date)\" >> $LOG\n"
              "HELPER=''\n"
              "for p in /var/jb/usr/bin/trollstorehelper /usr/bin/trollstorehelper /var/jb/basebin/trollstorehelper; do\n"
              "  [ -x \"$p\" ] && HELPER=$p && break\n"
              "done\n"
              "echo \"[postinst] helper=$HELPER ipa=$(test -f $IPA && echo yes || echo no)\" >> $LOG\n"
              "[ -z \"$HELPER\" ] && echo '[postinst] ERROR: no helper' >> $LOG && exit 1\n"
              "\"$HELPER\" install \"$IPA\" >> $LOG 2>&1\n"
              "EXIT=$?\n"
              "echo \"[postinst] exit=$EXIT\" >> $LOG\n"
              "rm -f \"$IPA\"\n"
              "exit $EXIT\n"
          )
          open("pkg/DEBIAN/postinst","w").write(postinst)
          os.chmod("pkg/DEBIAN/postinst", 0o755)
          postrm = (
              "#!/bin/bash\n"
              "for p in /var/jb/usr/bin/trollstorehelper /usr/bin/trollstorehelper; do\n"
              "  [ -x \"$p\" ] && \"$p\" uninstall com.amap.newmachine 2>/dev/null && break\n"
              "done\n"
          )
          open("pkg/DEBIAN/postrm","w").write(postrm)
          os.chmod("pkg/DEBIAN/postrm", 0o755)
          PYEOF
          cp ./ipa/AmapNewMachine.ipa pkg/var/jb/tmp/
          dpkg-deb --root-owner-group -b pkg com.dev.amapnewmachine_1.0.0_iphoneos-arm64.deb

      - name: Upload installer deb
        uses: actions/upload-artifact@v4
        with:
          name: AmapNewMachine-installer
          path: com.dev.amapnewmachine_1.0.0_iphoneos-arm64.deb
          if-no-files-found: error
