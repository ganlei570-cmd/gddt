name: Build AmapNewDevice

on:
  push:
    paths:
      - 'Reverse/output/tweak/**'
      - 'ios_app/**'
  workflow_dispatch:

jobs:
  build-tweak:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          ln -sf $XCODE_SDK $THEOS/sdks/iPhoneOS16.5.sdk

      - name: Build .deb
        run: make -C Reverse/output/tweak package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: AmapNewDevice-deb
          path: Reverse/output/tweak/packages/*.deb
          if-no-files-found: error

  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios_app && xcodegen generate

      - name: Build app
        run: |
          cd ios_app
          xcodebuild \
            -project AmapNewMachine.xcodeproj \
            -scheme AmapNewMachine \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Package IPA
        run: |
          cd ios_app
          APP_PATH=$(find build/Build/Products -name "*.app" -not -path "*/Intermediates*" | head -1)
          echo "App path: $APP_PATH"
          APP_NAME=$(basename "$APP_PATH" .app)
          echo "App name: $APP_NAME"
          brew install ldid
          ldid -Sentitlements.plist "$APP_PATH/$APP_NAME"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r AmapNewMachine.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AmapNewMachine-ipa
          path: ios_app/AmapNewMachine.ipa
          if-no-files-found: error
